<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVSpeak</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <h1>CVSpeak</h1>
        <p class="subtitle">Voice-operated CV creator</p>
    </header>
    
    <main>
        <section id="status-region" aria-live="polite" class="status-box">
            System is ready. Press Start or Spacebar to begin.
        </section>

        <section id="transcript-region" aria-live="assertive" class="transcript-box">
            <!-- Transcript appears here -->
        </section>

        <section class="controls">
            <button id="start-btn" aria-label="Start Interview">Start (Space)</button>
            <button id="record-btn" aria-label="Start or Stop Recording" disabled>Record (F)</button>
            <button id="next-btn" aria-label="Next Step" disabled>Next Step (J)</button>
        </section>
        <section class="controls" style="margin-top: 10px;">
            <button id="repeat-btn" aria-label="Repeat Last Audio">Repeat (R)</button>
            <button id="slower-btn" aria-label="Decrease Playback Speed">Slower ([)</button>
            <button id="faster-btn" aria-label="Increase Playback Speed">Faster (])</button>
        </section>

        <section id="camera-region" style="display: none; text-align: center; margin-top: 20px;">
            <video id="video" width="320" height="240" autoplay playsinline></video>
            <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
